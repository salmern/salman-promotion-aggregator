version: '3.9'

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: promotions-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promotions}
      MYSQL_USER: ${MYSQL_USER:-promotions_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-promotions_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: promotions-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Application ─────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: promotions-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-promotions_user}:${MYSQL_PASSWORD:-promotions_pass}@mysql:3306/${MYSQL_DATABASE:-promotions}
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: promotions-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-promotions_user}:${MYSQL_PASSWORD:-promotions_pass}@mysql:3306/${MYSQL_DATABASE:-promotions}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-production}
      SOURCE_PORTAL_URL: ${SOURCE_PORTAL_URL:-https://www.thepromenadeshopsatbriargate.com}
      SCRAPER_REQUEST_DELAY_MS: ${SCRAPER_REQUEST_DELAY_MS:-1500}
      SCRAPER_MAX_CONCURRENCY: ${SCRAPER_MAX_CONCURRENCY:-2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: promotions-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api

volumes:
  mysql_data:
